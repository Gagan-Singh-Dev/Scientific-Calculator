<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <title>Scientific Calculator</title>
    <link rel="icon" href="Favicon/Browser_Favicon.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bg" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <main class="calculator" role="application" aria-label="Scientific calculator">
        <header class="topbar">
            <div class="toggles" role="group" aria-label="Function toggles">
                <button class="chip active" data-action="toggle-angle" type="button">DEG</button>
                <button class="chip" data-action="toggle-shift" type="button">SHIFT</button>
                <button class="chip" data-action="open-eqn" type="button">EQN</button>
                <a class="github-fab" href="https://github.com/Gagan-Singh-Dev" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub profile">
                    <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.41-4.04-1.41-.55-1.38-1.34-1.75-1.34-1.75-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.08 1.83 2.82 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.66-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.37 1.24-3.21-.12-.3-.54-1.53.12-3.18 0 0 1.01-.33 3.3 1.23A11.5 11.5 0 0 1 12 5.8c1.02 0 2.05.14 3.01.42 2.29-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.77.84 1.24 1.9 1.24 3.21 0 4.6-2.81 5.63-5.49 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.21.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    <span class="sr-only">GitHub</span>
                </a>
            </div>
        </header>

        <section class="display" aria-live="polite">
            <p id="expression" class="expression" aria-label="Expression">0</p>
            <p id="result" class="result" aria-label="Result">0</p>

            <div class="calc-tool hidden" id="calcTool" aria-live="polite">
                <p class="calc-tool-title" id="calcToolTitle">Derivative Mode</p>
                <div class="calc-tool-fields" id="calcToolFields"></div>
                <div class="calc-tool-actions">
                    <button class="chip" id="calcToolCancel" type="button">Cancel</button>
                </div>
            </div>
        </section>

        <section class="keypad" id="keypad">
            <button class="btn btn-danger" data-action="clear" type="button">AC</button>
            <button class="btn" data-action="delete" type="button">DEL</button>
            <button class="btn btn-scientific" data-action="paren" data-value="(" type="button">(</button>
            <button class="btn btn-scientific" data-action="paren" data-value=")" type="button">)</button>
            <button class="btn btn-scientific" data-action="differentiate" type="button">d/dx</button>

            <button class="btn btn-scientific" data-action="fraction" type="button">a/b</button>
            <button class="btn btn-scientific" data-action="function" data-fn="log" type="button">log</button>
            <button class="btn btn-scientific" data-action="function" data-fn="ln" type="button">ln</button>
            <button class="btn btn-scientific" data-action="operator" data-value="^" type="button">xʸ</button>
            <button class="btn btn-scientific" data-action="integrate" type="button">∫dx</button>

            <button class="btn btn-scientific" data-action="function" data-fn="sin" data-alt="asin" type="button">sin</button>
            <button class="btn btn-scientific" data-action="function" data-fn="cos" data-alt="acos" type="button">cos</button>
            <button class="btn btn-scientific" data-action="function" data-fn="tan" data-alt="atan" type="button">tan</button>
            <button class="btn btn-scientific" data-action="reciprocal" type="button">x⁻¹</button>
            <button class="btn btn-op" data-action="operator" data-value="/" type="button">÷</button>

            <button class="btn" data-action="number" data-value="7" type="button">7</button>
            <button class="btn" data-action="number" data-value="8" type="button">8</button>
            <button class="btn" data-action="number" data-value="9" type="button">9</button>
            <button class="btn btn-scientific" data-action="square" type="button">x²</button>
            <button class="btn btn-op" data-action="operator" data-value="*" type="button">×</button>

            <button class="btn" data-action="number" data-value="4" type="button">4</button>
            <button class="btn" data-action="number" data-value="5" type="button">5</button>
            <button class="btn" data-action="number" data-value="6" type="button">6</button>
            <button class="btn btn-scientific" data-action="function" data-fn="sqrt" type="button">√</button>
            <button class="btn btn-op" data-action="operator" data-value="-" type="button">−</button>

            <button class="btn" data-action="number" data-value="1" type="button">1</button>
            <button class="btn" data-action="number" data-value="2" type="button">2</button>
            <button class="btn" data-action="number" data-value="3" type="button">3</button>
            <button class="btn btn-scientific" data-action="constant" data-value="pi" type="button">π</button>
            <button class="btn btn-op" data-action="operator" data-value="+" type="button">+</button>

            <button class="btn" data-action="number" data-value="0" type="button">0</button>
            <button class="btn btn-scientific" data-action="number" data-value="00" type="button">00</button>
            <button class="btn" data-action="decimal" type="button">.</button>
            <button class="btn btn-scientific" data-action="constant" data-value="e" type="button">e</button>
            <button class="btn btn-equals" data-action="equals" type="button">=</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
